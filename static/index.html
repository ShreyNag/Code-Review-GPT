<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code-Review-GPT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <aside class="w-80 glass-panel border-r border-gray-700 flex flex-col">
        <div class="p-6 border-b border-gray-700">
            <h2 class="text-xl font-bold text-blue-400">Review History</h2>
            <p class="text-xs text-gray-400 mt-1">Saved to PostgreSQL</p>
        </div>
        
        <div class="px-4 py-3 border-b border-gray-800">
            <input type="text" id="searchInput" onkeyup="filterHistory()" 
                placeholder="Search snippets..." 
                class="w-full p-2 bg-gray-900 border border-gray-700 rounded-lg text-xs text-gray-300 focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>

        <div id="historyList" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
    </aside>

    <main class="flex-1 flex flex-col p-8 overflow-y-auto">
        <div class="max-w-4xl mx-auto w-full space-y-6">
            <header>
                <h1 class="text-3xl font-extrabold text-white">Code-Review-GPT</h1>
                <p class="text-gray-400">Powered by Gemini 3 Flash Preview</p>
            </header>

            <div class="space-y-2">
                <label class="block text-sm font-medium text-gray-300">Code Snippet:</label>
                <textarea id="codeInput" rows="12" 
                    class="w-full p-4 bg-gray-900 border border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none font-mono text-sm text-green-400"
                    placeholder="Enter code here..."></textarea>
                <button onclick="submitCode()" id="submitBtn"
                    class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl transition-all shadow-lg active:scale-95">
                    Analyze Code
                </button>
            </div>

            <div id="resultArea" class="hidden">
                <h3 class="text-lg font-semibold text-blue-300 mb-2">AI Feedback:</h3>
                <div id="feedbackOutput" class="p-6 bg-gray-800 border border-gray-700 rounded-xl whitespace-pre-wrap text-sm leading-relaxed text-gray-200"></div>
            </div>
        </div>
    </main>

    <script>
        window.onload = fetchHistory;

        async function submitCode() {
            const codeInput = document.getElementById('codeInput');
            const submitBtn = document.getElementById('submitBtn');
            const feedbackOutput = document.getElementById('feedbackOutput');
            const resultArea = document.getElementById('resultArea');

            if (!codeInput.value.trim()) return alert("Please enter code!");
            submitBtn.innerText = "Processing...";
            submitBtn.disabled = true;

            try {
                const response = await fetch('/review', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: codeInput.value })
                });
                const data = await response.json();
                feedbackOutput.innerText = data.ai_feedback;
                resultArea.classList.remove('hidden');
                fetchHistory(); 
            } catch (error) {
                alert("Error connecting to server.");
            } finally {
                submitBtn.innerText = "Analyze Code";
                submitBtn.disabled = false;
            }
        }

        async function fetchHistory() {
            const list = document.getElementById('historyList');
            try {
                const response = await fetch('/history');
                const data = await response.json();
                list.innerHTML = '';

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "flex items-center gap-2 group bg-gray-800 p-3 rounded-lg border border-gray-700 hover:border-blue-500 transition";

                    const content = document.createElement('div');
                    content.className = "flex-1 cursor-pointer truncate text-xs";
                    content.innerHTML = `
                        <div class="text-blue-400 font-bold">${new Date(item.created_at).toLocaleTimeString()}</div>
                        <div class="text-gray-500 italic">${item.code_snippet.substring(0, 20)}...</div>
                    `;
                    content.onclick = () => {
                        document.getElementById('codeInput').value = item.code_snippet;
                        document.getElementById('feedbackOutput').innerText = item.ai_feedback;
                        document.getElementById('resultArea').classList.remove('hidden');
                    };

                    const pdfBtn = document.createElement('button');
                    pdfBtn.innerHTML = "📄";
                    pdfBtn.className = "opacity-0 group-hover:opacity-100 text-gray-400 hover:text-green-500 transition p-1";
                    pdfBtn.onclick = (e) => { e.stopPropagation(); window.location.href = `/download/${item.id}`; };

                    const delBtn = document.createElement('button');
                    delBtn.innerHTML = "🗑️";
                    delBtn.className = "opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-500 transition p-1";
                    delBtn.onclick = async (e) => {
                        e.stopPropagation();
                        if(confirm("Delete permanently?")) {
                            await fetch(`/delete/${item.id}`, { method: 'DELETE' });
                            fetchHistory();
                        }
                    };

                    card.appendChild(content);
                    card.appendChild(pdfBtn);
                    card.appendChild(delBtn);
                    list.appendChild(card);
                });
            } catch (e) { console.error(e); }
        }

        function filterHistory() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('#historyList > div');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(term) ? "flex" : "none";
            });
        }
    </script>
</body>
</html>
